spring.application.name=SHIPPING-SERVICE
server.port=8083
spring.cloud.config.enabled=true

# Primary Database (Loaded from config-server, falls back to local database)
# Primary Database (Loaded from config-server, falls back to local database)
spring.datasource.url=jdbc:postgresql://192.168.1.232:5432/e-commerce
spring.datasource.username=postgres
spring.datasource.password=Msp@321#
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# ===============================
# ACTUATOR CONFIGURATION
# ===============================

# Enable all actuator endpoints
management.endpoints.web.exposure.include=*

# Show full health details
management.endpoint.health.show-details=always

# Change base path (optional)
management.endpoints.web.base-path=/actuator

#spring.config.import=configserver:http://localhost:8888

# ===============================
# PROMETHEUS METRICS
# ===============================

# Enable Prometheus metrics export
management.metrics.export.prometheus.enabled=true


# ===============================
# APPLICATION INFO (Optional)
# ===============================

info.app.name=SHIPPING-SERVICE
info.app.version=1.0.0
info.app.description=Monitoring Enabled Application



