spring.application.name=USER-SERVICE
server.port=8082

# Primary Database (Loaded from config-server, falls back to local database)
# Primary Database (Loaded from config-server, falls back to local database)
spring.datasource.url=jdbc:postgresql://192.168.1.232:5432/e-commerce
spring.datasource.username=postgres
spring.datasource.password=Msp@321#
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

eureka.client.fetch-registry=false
eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# ===============================
# ACTUATOR CONFIGURATION
# ===============================

# Enable all actuator endpoints
management.endpoints.web.exposure.include=*

# Show full health details
management.endpoint.health.show-details=always

# Change base path (optional)
management.endpoints.web.base-path=/actuator


# ===============================
# PROMETHEUS METRICS
# ===============================

# Enable Prometheus metrics export
management.metrics.export.prometheus.enabled=true


# ===============================
# APPLICATION INFO (Optional)
# ===============================

info.app.name=USER-SERVICE
info.app.version=1.0.0
info.app.description=Monitoring Enabled Application



spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.cloud.config.enabled=true

spring.cloud.config.import-check.enabled=false
# Twilio SMS configuration
twilio.account.sid=
twilio.auth.token=
